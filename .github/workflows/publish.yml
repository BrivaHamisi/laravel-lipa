name: publish

# Publishes to npm when a GitHub release is published, using npm trusted publishing:
# GitHub proves to npm that this workflow built the package, so no npm token is stored
# anywhere, and npm shows a verified provenance badge.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5 or newer.
      - name: Use a pinned npm
        run: npm install --global npm@12.1.0

      - name: The release tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package.json version ${version}." >&2
            exit 1
          fi

      - name: Skip versions already on npm (e.g. the first, hand-published release)
        id: published
        run: |
          if npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" version > /dev/null 2>&1; then
            echo "This version is already on npm; nothing to publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer tests
        if: steps.published.outputs.exists != 'true'
        run: npm test

      - name: Publish
        if: steps.published.outputs.exists != 'true'
        run: npm publish --provenance --access public
